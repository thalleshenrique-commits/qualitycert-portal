<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Qualitycert | Acesso</title><style>
:root{--p:#5b2382;--p2:#7c3aad;--bg:#f6f3f8;--txt:#28212e;--mut:#786f81;--line:#e8e0ec}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#271139,#6b2f91);padding:22px}.card{width:min(510px,100%);background:#fff;border-radius:24px;padding:30px;box-shadow:0 30px 80px #0005}.brand{color:var(--p);font-weight:900;letter-spacing:.08em}.card h1{margin:10px 0 6px;font-size:30px}.sub{color:var(--mut);line-height:1.5}.tabs{display:flex;gap:8px;background:#f4eff7;padding:5px;border-radius:12px;margin:20px 0}.tab{flex:1;border:0;background:transparent;padding:10px;border-radius:9px;font-weight:800;color:#6c5d75;cursor:pointer}.tab.active{background:#fff;color:var(--p);box-shadow:0 2px 8px #0001}.panel{display:none}.panel.active{display:block}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;font-weight:800}.field input,.field select{width:100%;border:1px solid #d9cedf;border-radius:11px;padding:12px;outline:none}.btn{width:100%;border:0;border-radius:11px;padding:12px;background:linear-gradient(90deg,var(--p),var(--p2));color:#fff;font-weight:900;cursor:pointer}.msg{margin-top:12px;padding:10px 12px;border-radius:10px;background:#f6f2f8;color:#5c5263;font-size:12px;min-height:36px}.note{font-size:11px;color:var(--mut);line-height:1.45;margin-top:14px}</style></head><body><div class="card"><div class="brand">QUALITYCERT</div><h1>Portal interno</h1><div class="sub">Entre com seu usuário. Seu progresso, provas e notas ficam vinculados à sua conta.</div><div class="tabs"><button class="tab active" data-tab="in">Entrar</button><button class="tab" data-tab="up">Primeiro acesso</button></div><div class="panel active" id="in"><div class="field"><label>E-mail corporativo</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>Senha</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn" id="loginBtn">Entrar</button></div><div class="panel" id="up"><div class="field"><label>Nome completo</label><input id="name"></div><div class="field"><label>E-mail corporativo</label><input id="newEmail" type="email"></div><div class="field"><label>Área</label><select id="area"><option>Novato</option><option>Onboarding</option><option>Direta</option><option>Revenda</option><option>Lote</option><option>Indicação / Fidelização</option><option>Atendimento</option><option>Pendências</option><option>Grandes Contas</option><option>SST</option><option>Gestão</option></select></div><div class="field"><label>Crie uma senha (mínimo 8 caracteres)</label><input id="newPassword" type="password"></div><button class="btn" id="signupBtn">Criar meu acesso</button><div class="note">A área informa onde você atua. Permissões de coordenação, gerência e administração são liberadas somente pela gestão do sistema.</div></div><div id="msg" class="msg">Aguardando acesso.</div></div><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const msg=document.getElementById('msg');
function show(t){msg.textContent=t;}
const cfg=window.QUALITYCERT_SUPABASE||{};
if(!cfg.url||!cfg.anonKey){show('Configuração do Supabase não encontrada.');}
else if(!window.supabase){show('Não foi possível carregar a conexão com o Supabase. Atualize a página e tente novamente.');}
else {
 const sb=window.supabase.createClient(cfg.url,cfg.anonKey);
 const next=new URLSearchParams(location.search).get('next')||'index.html';
 sb.auth.getSession().then(({data})=>{if(data&&data.session) location.replace(next);}).catch(()=>{});
 document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')});
 document.getElementById('loginBtn').onclick=async()=>{try{show('Entrando...');const em=document.getElementById('email').value.trim();const pw=document.getElementById('password').value;const {error}=await sb.auth.signInWithPassword({email:em,password:pw});if(error){show('Não foi possível entrar: '+error.message);return}location.replace(next);}catch(e){show('Erro de conexão: '+(e.message||e));}};
 document.getElementById('signupBtn').onclick=async()=>{try{const full_name=document.getElementById('name').value.trim(),em=document.getElementById('newEmail').value.trim(),pw=document.getElementById('newPassword').value,ar=document.getElementById('area').value;if(!full_name||!em||pw.length<8){show('Preencha nome, e-mail e senha com pelo menos 8 caracteres.');return}show('Criando acesso...');const {data,error}=await sb.auth.signUp({email:em,password:pw,options:{data:{full_name,area:ar},emailRedirectTo:'https://thalleshenrique-commits.github.io/qualitycert-portal/login.html'}});if(error){show('Não foi possível criar: '+error.message);return}if(data&&data.session){show('Acesso criado. Entrando...');setTimeout(()=>location.replace(next),700);}else{show('Acesso criado. Verifique seu e-mail corporativo para confirmar a conta e depois volte para entrar.');}}catch(e){show('Erro de conexão: '+(e.message||e));}};
}
</script></body></html>
